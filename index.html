<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crop Recommendation and Price Prediction</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        html { scroll-behavior: smooth; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-nav { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,0.05); }
        .layer { display: none; }
        .layer.active { display: block; animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="text-slate-900 bg-white">

    <nav class="fixed w-full z-50 glass-nav px-6 py-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="bg-emerald-600 p-2 rounded-lg text-white"><i class="fas fa-leaf"></i></div>
                <span class="text-xl font-extrabold tracking-tight">AgroVision <span class="text-emerald-600">AI</span></span>
            </div>
            <div class="flex gap-8 font-semibold text-sm">
                <a href="#home" class="hover:text-emerald-600 transition">Home</a>
                <a href="#predictor" class="hover:text-emerald-600 transition">Predictor</a>
                <a href="#farmer-hub" class="hover:text-emerald-600 transition">Info Hub</a>
            </div>
        </div>
    </nav>

    <section id="home" class="min-h-screen flex items-center bg-slate-50 pt-20">
        <div class="max-w-7xl mx-auto px-6 grid lg:grid-cols-2 gap-12 items-center">
            <div>
                <h1 class="text-6xl font-extrabold leading-tight mb-6">AI BASED <br><span class="text-emerald-600">CROP & PRICE PREDICTION.</span></h1>
                <p class="text-lg text-slate-600 mb-8 max-w-lg">Empowering Indian farmers with data-driven insights for better yields and market value.</p>
                <a href="#predictor" class="bg-slate-900 text-white px-10 py-4 rounded-2xl font-bold shadow-xl">Get Started</a>
            </div>
            <img src="https://images.unsplash.com/photo-1523348837708-15d4a09cfac2?auto=format&fit=crop&q=80&w=800" class="rounded-[3rem] shadow-2xl" alt="Farming">
        </div>
    </section>

    <section id="predictor" class="py-32 min-h-screen">
        <div class="max-w-4xl mx-auto px-6">
            
            <div id="step-1" class="layer active text-center">
                <h2 class="text-4xl font-extrabold mb-10 text-slate-800">Select Season</h2>
                <div class="grid md:grid-cols-3 gap-6">
                    <button onclick="nextLayer('Summer', 25, 45, 30, 60, 0, 100)" class="p-8 bg-slate-50 rounded-3xl hover:border-emerald-500 border-2 border-transparent transition shadow-sm">
                        <i class="fas fa-sun text-4xl text-orange-400 mb-4"></i>
                        <p class="font-bold">Zaid (Summer)</p>
                    </button>
                    <button onclick="nextLayer('Winter', 10, 25, 20, 50, 10, 80)" class="p-8 bg-slate-50 rounded-3xl hover:border-emerald-500 border-2 border-transparent transition shadow-sm">
                        <i class="fas fa-snowflake text-4xl text-blue-400 mb-4"></i>
                        <p class="font-bold">Rabi (Winter)</p>
                    </button>
                    <button onclick="nextLayer('Monsoon', 20, 35, 70, 100, 150, 600)" class="p-8 bg-slate-50 rounded-3xl hover:border-emerald-500 border-2 border-transparent transition shadow-sm">
                        <i class="fas fa-cloud-showers-heavy text-4xl text-emerald-400 mb-4"></i>
                        <p class="font-bold">Kharif (Monsoon)</p>
                    </button>
                </div>
            </div>

            <div id="step-2" class="layer">
                <div class="bg-white p-10 rounded-[3rem] shadow-2xl border border-slate-100">
                    <div class="flex justify-between items-center mb-8">
                        <h3 class="text-2xl font-bold">Climate for <span id="layer-season" class="text-emerald-600"></span></h3>
                        <button onclick="goBack()" class="text-emerald-600 text-sm font-bold"><i class="fas fa-redo mr-1"></i> Change Season</button>
                    </div>
                    <div class="grid md:grid-cols-3 gap-6 mb-8">
                        <div>
                            <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Temp (<span id="t-lim"></span>°C)</label>
                            <input type="number" id="temp" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-4 focus:ring-2 focus:ring-emerald-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Humidity (<span id="h-lim"></span>%)</label>
                            <input type="number" id="humidity" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-4 focus:ring-2 focus:ring-emerald-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Rainfall (<span id="r-lim"></span>mm)</label>
                            <input type="number" id="rainfall" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-4 focus:ring-2 focus:ring-emerald-500 outline-none">
                        </div>
                    </div>
                    <button id="predict-btn" onclick="getFinalPrediction()" class="w-full bg-emerald-600 text-white font-bold py-5 rounded-2xl transition hover:bg-emerald-700">Analyze Data</button>
                </div>
            </div>

            <div id="step-3" class="layer text-center">
                <div id="result-card" class="p-16 rounded-[4rem] text-white shadow-2xl">
                    <h2 id="final-crop" class="text-7xl font-black capitalize mb-8"></h2>
                    <div class="bg-black/20 p-8 rounded-3xl border border-white/10 max-w-sm mx-auto">
                        <p class="text-xs font-bold uppercase opacity-60 mb-2">Market Price (during harvesting)</p>
                        <p class="text-5xl font-bold text-yellow-300">
                            ₹ <span id="final-price">0</span><span class="text-xl ml-1 opacity-90 font-semibold">/qtl</span>
                        </p>
                    </div>
                    <button onclick="resetAll()" class="mt-12 text-white font-bold underline">New Prediction</button>
                </div>
            </div>
        </div>
    </section>

    <footer class="py-12 bg-slate-900 text-center text-slate-500 text-[10px] italic uppercase tracking-widest">
        JUET Guna | Minor Project 2026
    </footer>

    <script>
        const RENDER_API_URL = 'https://crop-recommendation-and-price-prediction-650y.onrender.com/api/recommend';

        function nextLayer(name, tMin, tMax, hMin, hMax, rMin, rMax) {
            document.getElementById('layer-season').innerText = name;
            document.getElementById('t-lim').innerText = tMin + "-" + tMax;
            document.getElementById('h-lim').innerText = hMin + "-" + hMax;
            document.getElementById('r-lim').innerText = rMin + "-" + rMax;
            document.getElementById('temp').value = (tMin + tMax) / 2;
            document.getElementById('humidity').value = (hMin + hMax) / 2;
            document.getElementById('rainfall').value = (rMin + rMax) / 2;
            document.getElementById('step-1').classList.remove('active');
            document.getElementById('step-2').classList.add('active');
        }

        function goBack() {
            document.getElementById('step-2').classList.remove('active');
            document.getElementById('step-1').classList.add('active');
        }

        async function getFinalPrediction() {
            const btn = document.getElementById('predict-btn');
            const originalText = btn.innerText;
            btn.innerText = "Analyzing... Please wait";
            btn.disabled = true;

            const data = {
                temp: parseFloat(document.getElementById('temp').value),
                humidity: parseFloat(document.getElementById('humidity').value),
                rainfall: parseFloat(document.getElementById('rainfall').value)
            };

            try {
                const res = await fetch(RENDER_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                const result = await res.json();
                
                if (result.status === "success") {
                    document.getElementById('final-crop').innerText = result.crop;
                    const formattedPrice = Number(result.price_value).toLocaleString('en-IN');
                    document.getElementById('final-price').innerText = formattedPrice;
                    
                    const card = document.getElementById('result-card');
                    const lowerCrop = result.crop.toLowerCase();
                    if (lowerCrop === 'rice' || lowerCrop === 'jute') {
                        card.className = "p-16 rounded-[4rem] text-white shadow-2xl bg-emerald-900";
                    } else if (lowerCrop === 'maize' || lowerCrop === 'cotton') {
                        card.className = "p-16 rounded-[4rem] text-white shadow-2xl bg-orange-700";
                    } else {
                        card.className = "p-16 rounded-[4rem] text-white shadow-2xl bg-slate-800";
                    }
                    
                    document.getElementById('step-2').classList.remove('active');
                    document.getElementById('step-3').classList.add('active');
                } else {
                    alert("Error: " + (result.message || "Something went wrong"));
                }
            } catch (e) { 
                alert("The AI server is waking up. Please try again in 30 seconds."); 
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }

        function resetAll() {
            document.getElementById('step-3').classList.remove('active');
            document.getElementById('step-1').classList.add('active');
            window.location.hash = "predictor";
        }
    </script>
</body>
</html>
